plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 40
        versionName '2.11.26'
        ['NASA_API_KEY', 'PEXELS_API_KEY', 'PIXABAY_API_KEY', 'WEATHER_LATITUDE', 'WEATHER_LONGITUDE', 'WEATHER_PLACE'].each { k -> buildConfigField 'String', k, '"' + (localProps.getProperty(k, '').replace('\\', '\\\\').replace('"', '\\"')) + '"' }
        buildConfigField 'String', 'UNSPLASH_ACCESS_KEY', '"' + (localProps.getProperty('UNSPLASH_ACCESS_KEY', '').replace('\\', '\\\\').replace('"', '\\"')) + '"'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}

